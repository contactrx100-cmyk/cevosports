<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cevosports – Join the Club</title>
<meta name="description" content="Join the club. Pursuit of greatness.">
<meta property="og:title" content="CEVOSPORTS – JOIN THE CLUB.">
<meta property="og:description" content="Pursuit of greatness.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;min-height:100dvh;max-width:440px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 28px 40px;display:flex;flex-direction:column}
.brand{font-size:12px;font-weight:700;letter-spacing:.42em}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 0}
h1{font-size:52px;line-height:.95;font-weight:900;letter-spacing:-.03em;margin-bottom:40px}
input{width:100%;background:transparent;border:0;border-bottom:1px solid #333;color:#fff;font:inherit;font-size:18px;padding:14px 0;outline:none;border-radius:0}
input::placeholder{color:#555}
input:focus{border-bottom-color:#fff}
button{width:100%;margin-top:24px;background:#fff;color:#000;border:0;font:inherit;font-weight:900;font-size:15px;letter-spacing:.2em;padding:18px;cursor:pointer}
button:disabled{opacity:.4}
.small{font-size:12px;color:#666;margin-top:14px;font-style:italic}
.err{font-size:13px;color:#ff5a5a;min-height:18px;margin-top:10px}
.k{font-size:15px;font-weight:700;letter-spacing:.2em;color:#8a8a8a}
.n{font-size:120px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:10px 0 28px}
.t{font-size:22px;font-weight:900}
.s{font-size:15px;color:#8a8a8a;margin-top:8px}
#done{display:none}
.foot{font-size:11px;color:#555;letter-spacing:.3em}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">CEVOSPORTS</div>
  <div class="mid">
    <form id="f" novalidate>
      <h1>JOIN<br>THE CLUB.</h1>
      <input type="email" id="email" placeholder="Email" autocomplete="email" inputmode="email" required>
      <div aria-hidden="true" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden"><label>Leave this empty <input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
      <button id="go" type="submit">JOIN THE CLUB</button>
      <div class="err" id="err"></div>
      <div class="small">You'll get emails from Cevosports. Unsubscribe anytime. <a href="/privacy" style="color:#666">Privacy</a></div>
    </form>
    <div id="done">
      <div class="k" id="k">YOU'RE MEMBER</div>
      <div class="n" id="n">#</div>
      <div class="t">Welcome to the club.</div>
      <div class="s">Pursuit of greatness starts now.</div>
      <div class="s" id="mail" style="margin-top:28px;font-size:13px;color:#666">Check your inbox. Your welcome email is on its way.</div>
    </div>
  </div>
  <div class="foot">PURSUIT OF GREATNESS</div>
</div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbxMQEfqvAUdDhcBYq2XZXuCiNClxlY61XqAvPqdJy-t6njiA5pB15nf94_tN4kYCh9kgw/exec';
var f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
var loaded = Date.now();
f.addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Add a valid email.'; return; }
  err.textContent = ''; go.disabled = true; go.textContent = 'JOINING…';
  // Spam trap: bots fill the hidden field or submit instantly. Show success, save nothing.
  if (document.getElementById('website').value || Date.now() - loaded < 2000) {
    setTimeout(function () {
      document.getElementById('n').textContent = '#';
      document.getElementById('mail').style.display = 'none';
      f.style.display = 'none';
      document.getElementById('done').style.display = 'block';
    }, 800);
    return;
  }
  fetch(API, { method: 'POST', body: JSON.stringify({ email: email }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) throw new Error(d.error || 'x');
      document.getElementById('n').textContent = '#' + String(d.num).padStart(3, '0');
      if (d.again) { document.getElementById('k').textContent = "YOU'RE ALREADY MEMBER"; document.getElementById('mail').style.display = 'none'; }
      f.style.display = 'none';
      document.getElementById('done').style.display = 'block';
    })
    .catch(function () {
      err.textContent = 'Something went wrong. Try again.';
      go.disabled = false; go.textContent = 'JOIN THE CLUB';
    });
});
</script>
</body>
</html>
